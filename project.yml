name: DigitalKuji
options:
  bundleIdPrefix: com.tokyonasu
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "15.4"

packages:
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads
    from: "11.0.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    MARKETING_VERSION: "1.1"
    CURRENT_PROJECT_VERSION: 1
    DEVELOPMENT_TEAM: 83VGKGSQUH

targets:
  DigitalKuji:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: DigitalKuji
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tokyonasu.digitalkuji
        INFOPLIST_FILE: DigitalKuji/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - package: GoogleMobileAds
        product: GoogleMobileAds
    scheme: {}
